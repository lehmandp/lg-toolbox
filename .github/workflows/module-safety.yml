name: Toolbox module safeguards

on:
  pull_request:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

jobs:
  module-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:modules
      - run: npx tsc --noEmit
